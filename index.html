<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Branch Inventory & Sales Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf9',
                            100: '#ccfbf1',
                            500: '#2aa18a',
                            600: '#1f7a68',
                            700: '#165c4f',
                            800: '#134e44',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[9999] p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-100 space-y-5">
            <div class="text-center">
                <div class="inline-flex bg-brand-500 text-white p-3.5 rounded-2xl shadow-lg mb-3">
                    <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Cloud Login</h2>
                <p class="text-xs text-slate-500 mt-1">Select workspace & authenticate via Supabase</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Branch / Role</label>
                    <select id="loginBranch" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-500 outline-none">
                        <option value="ADMIN">ADMIN WORKSPACE</option>
                        <option value="BATAAN">BATAAN</option>
                        <option value="CONCEPCION">CONCEPCION</option>
                        <option value="CAPAS">CAPAS</option>
                        <option value="GUIMBA">GUIMBA</option>
                        <option value="PANIQUI">PANIQUI</option>
                        <option value="ONE">ONE</option>
                        <option value="TWO">TWO</option>
                        <option value="THREE">THREE</option>
                        <option value="FOUR">FOUR</option>
                        <option value="FIVE">FIVE</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" placeholder="Enter workspace password" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 pr-10 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-brand-500 outline-none">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-eye" id="pwdEyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div id="loginErrorMsg" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs p-3 rounded-xl font-medium text-center">
                    Invalid branch or password.
                </div>

                <button onclick="loginSystem()" id="btnLogin" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-3.5 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                    <span id="btnText">Sign In</span>
                    <i class="fa-solid fa-spinner fa-spin hidden" id="btnSpinner"></i>
                </button>
            </div>

            <div class="text-center border-t border-slate-100 pt-3">
                <span class="text-[10px] text-slate-400">Synced with Supabase Cloud DB</span>
            </div>
        </div>
    </div>

    <!-- TOP NAV BAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-brand-500 text-white p-2.5 rounded-xl shadow-md">
                        <i class="fa-solid font-bold fa-boxes-stacked text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight text-slate-900">Multi-Branch System</h1>
                        <p class="text-xs text-slate-500 font-medium" id="headerRoleBadge">Inventory & Sales Hub</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="loadDataFromCloud()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-3 rounded-lg border border-slate-200 transition">
                        <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Sync Cloud
                    </button>
                    <button onclick="logoutSystem()" class="text-xs bg-rose-500 hover:bg-rose-600 text-
